<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg mn-navbar shadow-sm">
    <div class="container-fluid px-4">

        <!-- Brand -->
        <a class="navbar-brand" href="/dashboard">📬 MailNotifier</a>

        <!-- Hamburger -->
        <button class="navbar-toggler border-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <!-- Nav links -->
            <ul class="navbar-nav me-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link rounded px-3"
                       th:classappend="${activePage == 'dashboard'} ? ' active bg-white bg-opacity-10 fw-semibold'"
                       href="/dashboard">
                        <i class="bi bi-house me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded px-3"
                       th:classappend="${activePage == 'expectations'} ? ' active bg-white bg-opacity-10 fw-semibold'"
                       href="/expectations">
                        <i class="bi bi-list-check me-1"></i>Beklentilerim
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded px-3"
                       th:classappend="${activePage == 'matches'} ? ' active bg-white bg-opacity-10 fw-semibold'"
                       href="/matches">
                        <i class="bi bi-envelope-check me-1"></i>Eşleşmeler
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded px-3"
                       th:classappend="${activePage == 'notifications'} ? ' active bg-white bg-opacity-10 fw-semibold'"
                       href="/notifications">
                        <i class="bi bi-bell me-1"></i>Bildirimler
                    </a>
                </li>
            </ul>

            <!-- Right: bell + profile -->
            <div class="d-flex align-items-center gap-3 mt-2 mt-lg-0">

                <!-- Notification bell -->
                <a href="/notifications" class="text-white text-decoration-none position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span id="notification-badge"
                          th:class="${(unreadCount != null and unreadCount > 0) ? 'notification-badge' : 'notification-badge d-none'}"
                          th:text="${(unreadCount != null and unreadCount > 99) ? '99+' : unreadCount}">0</span>
                </a>

                <!-- Profile dropdown -->
                <div class="dropdown">
                    <button class="btn btn-link text-white dropdown-toggle p-0 border-0 d-flex align-items-center gap-2 text-decoration-none"
                            type="button" data-bs-toggle="dropdown">
                        <img th:if="${user != null and user.profilePictureUrl != null}"
                             th:src="${user.profilePictureUrl}" class="avatar-sm" alt="">
                        <span th:unless="${user != null and user.profilePictureUrl != null}"
                              class="avatar-initials"
                              th:text="${user != null ? #strings.substring(user.name, 0, 1).toUpperCase() : 'U'}">U</span>
                        <span class="fw-semibold small d-none d-md-inline"
                              th:text="${user != null ? user.name : ''}">Kullanıcı</span>
                        <i class="bi bi-chevron-down small"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <span class="dropdown-item-text small text-muted"
                                  th:text="${user != null ? user.email : ''}">email</span>
                        </li>
                        <li><hr class="dropdown-divider m-1"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
