<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mn-navbar">
    <div class="container-fluid px-3 px-lg-4">

        <a class="navbar-brand" href="/dashboard">
            <span class="brand-mark">📬</span>MailNotifier
        </a>

        <div class="d-flex align-items-center gap-2 d-lg-none ms-auto me-2">
            <a href="/notifications" class="nav-icon-btn js-bell" aria-label="Bildirimler">
                <i class="bi bi-bell"></i>
                <span th:class="${(unreadCount != null and unreadCount > 0) ? 'notification-badge js-notif-badge' : 'notification-badge js-notif-badge d-none'}"
                          th:text="${(unreadCount != null and unreadCount > 99) ? '99+' : unreadCount}">0</span>
            </a>
            <button type="button" class="nav-icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Tema değiştir">
                <i class="bi bi-moon-stars"></i><i class="bi bi-sun"></i>
            </button>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Menüyü aç">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav me-auto gap-lg-1 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" href="/dashboard">
                        <i class="bi bi-grid-1x2 me-2"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'expectations'} ? 'active'" href="/expectations">
                        <i class="bi bi-list-check me-2"></i>Beklentilerim
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'matches'} ? 'active'" href="/matches">
                        <i class="bi bi-envelope-check me-2"></i>Eşleşmeler
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'notifications'} ? 'active'" href="/notifications">
                        <i class="bi bi-bell me-2"></i>Bildirimler
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                <!-- Tema geçişi -->
                <button type="button" class="nav-icon-btn theme-toggle d-none d-lg-inline-flex" onclick="toggleTheme()" aria-label="Tema değiştir">
                    <i class="bi bi-moon-stars"></i><i class="bi bi-sun"></i>
                </button>

                <!-- Bildirim zili -->
                <a href="/notifications" class="nav-icon-btn js-bell d-none d-lg-inline-flex" aria-label="Bildirimler">
                    <i class="bi bi-bell"></i>
                    <span id="notification-badge"
                          th:class="${(unreadCount != null and unreadCount > 0) ? 'notification-badge js-notif-badge' : 'notification-badge js-notif-badge d-none'}"
                          th:text="${(unreadCount != null and unreadCount > 99) ? '99+' : unreadCount}">0</span>
                </a>

                <!-- Profil -->
                <div class="dropdown">
                    <button class="profile-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <img th:if="${user != null and user.profilePictureUrl != null}"
                             th:src="${user.profilePictureUrl}" class="avatar-sm" alt="" referrerpolicy="no-referrer">
                        <span th:unless="${user != null and user.profilePictureUrl != null}"
                              class="avatar-initials"
                              th:text="${user != null ? #strings.substring(user.name, 0, 1).toUpperCase() : 'U'}">U</span>
                        <span class="fw-semibold small d-lg-none d-xl-inline"
                              th:text="${user != null ? user.name : ''}">Kullanıcı</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li class="dropdown-user">
                            <div class="name" th:text="${user != null ? user.name : ''}">Kullanıcı</div>
                            <div class="mail" th:text="${user != null ? user.email : ''}">email</div>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
