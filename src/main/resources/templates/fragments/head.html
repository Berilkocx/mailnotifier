<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — MailNotifier'">MailNotifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; }

        /* Navbar */
        .mn-navbar { background: #1a1a2e !important; }
        .mn-navbar .nav-link { color: rgba(255,255,255,.8) !important; }
        .mn-navbar .nav-link:hover,
        .mn-navbar .nav-link.active { color: #fff !important; }
        .mn-navbar .navbar-brand { color: #fff !important; font-weight: 700; }

        /* Avatar */
        .avatar-sm { width: 32px; height: 32px; object-fit: cover; border-radius: 50%; }
        .avatar-initials {
            width: 32px; height: 32px; border-radius: 50%;
            background: #4f46e5; color: white;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px;
        }

        /* Notification badge */
        .notification-badge {
            position: absolute; top: -6px; right: -8px;
            background: #ef4444; color: white;
            border-radius: 10px; min-width: 18px; height: 18px;
            font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px; pointer-events: none;
        }

        /* Stat cards */
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); transition: transform .15s, box-shadow .15s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
        .stat-icon { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .stat-value { font-size: 28px; font-weight: 700; line-height: 1; }
        .stat-label { font-size: 12px; color: #6b7280; margin-top: 2px; }

        /* Confidence badges */
        .badge-high   { background: #198754 !important; }
        .badge-medium { background: #ffc107 !important; color: #000 !important; }
        .badge-low    { background: #6c757d !important; }

        /* Section header */
        .section-title { font-size: 16px; font-weight: 600; color: #374151; }

        /* Footer */
        .mn-footer { background: #1a1a2e; color: rgba(255,255,255,.5); font-size: 13px; }

        /* Empty state */
        .empty-state { padding: 48px 24px; text-align: center; color: #9ca3af; }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body></body>
</html>
