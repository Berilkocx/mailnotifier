<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailNotifier — Sayfa Bulunamadı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-code { font-size: 96px; font-weight: 800; color: #dee2e6; line-height: 1; }
        .error-icon { font-size: 56px; }
    </style>
</head>
<body>
<div class="text-center px-4">
    <div class="error-code mb-2">404</div>
    <div class="error-icon mb-3">📭</div>
    <h4 class="fw-bold mb-2">Sayfa Bulunamadı</h4>
    <p class="text-muted mb-4">Aradığınız sayfa mevcut değil veya taşınmış olabilir.</p>
    <a href="/dashboard" class="btn btn-primary px-4">
        <i class="bi bi-house me-2"></i>Dashboard'a Dön
    </a>
</div>
</body>
</html>
