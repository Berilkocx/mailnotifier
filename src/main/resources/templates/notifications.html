<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/head :: head('Bildirimler')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container-fluid px-4 py-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold">Bildirimler</h4>
            <p class="text-muted small mb-0">Tüm mail eşleşme bildirimleriniz.</p>
        </div>
        <button class="btn btn-outline-secondary btn-sm" onclick="markAllRead()" th:if="${unreadCount > 0}">
            <i class="bi bi-check2-all me-1"></i>Tümünü Okundu Yap
        </button>
    </div>

    <!-- Boş durum -->
    <div th:if="${#lists.isEmpty(notifications)}" class="card border-0 shadow-sm">
        <div class="empty-state">
            <div class="empty-icon">🔕</div>
            <p class="fw-semibold mb-1">Henüz bildirim yok.</p>
            <p class="text-muted small">Bir beklentiyle eşleşen mail geldiğinde burada görünecek.</p>
        </div>
    </div>

    <!-- Bildirim Listesi -->
    <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(notifications)}">
        <ul class="list-group list-group-flush">
            <li th:each="n : ${notifications}"
                th:id="${'notif-' + n.id}"
                th:class="${'list-group-item px-4 py-3 ' + (!n.isRead ? 'unread-notification' : '')}">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div class="flex-grow-1 min-w-0">
                        <!-- Confidence badge + message -->
                        <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                            <span th:class="${'badge ' + (n.confidenceLevel.name() == 'HIGH' ? 'badge-high' : (n.confidenceLevel.name() == 'MEDIUM' ? 'badge-medium' : 'badge-low'))}"
                                  th:text="${n.confidenceLevel.name() == 'HIGH' ? 'Yüksek' : (n.confidenceLevel.name() == 'MEDIUM' ? 'Orta' : 'Düşük')}">Orta</span>
                            <span th:class="${'fw-semibold small ' + (!n.isRead ? '' : 'text-muted')}"
                                  th:text="${n.message}">Mesaj</span>
                        </div>
                        <!-- Mail info -->
                        <div class="text-muted small">
                            <span th:if="${n.mailFrom}">
                                <i class="bi bi-person me-1"></i><span th:text="${n.mailFrom}">Gönderen</span>
                                <span class="mx-1">·</span>
                            </span>
                            <span th:if="${n.mailSubject}">
                                <i class="bi bi-envelope me-1"></i><span th:text="${n.mailSubject}">Konu</span>
                            </span>
                        </div>
                        <!-- Expectation -->
                        <div th:if="${n.expectationDescription}" class="text-muted small mt-1">
                            <i class="bi bi-link-45deg"></i>
                            <span th:text="${n.expectationDescription}">Beklenti</span>
                        </div>
                    </div>
                    <!-- Time + actions -->
                    <div class="flex-shrink-0 text-end">
                        <div class="text-muted small mb-2"
                             th:attr="data-time=${n.createdAt}">tarih</div>
                        <div class="d-flex gap-1 justify-content-end">
                            <button th:if="${!n.isRead}"
                                    class="btn btn-sm btn-outline-secondary"
                                    th:onclick="|markRead('${n.id}')|"
                                    title="Okundu yap">
                                <i class="bi bi-check2"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger"
                                    th:onclick="|deleteNotification('${n.id}')|"
                                    title="Sil">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</main>

<style>
    .unread-notification { background: #f0f7ff; border-left: 3px solid #0d6efd; }
</style>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

<script>
    async function markRead(id) {
        await apiCall('/api/notifications/' + id + '/read', { method: 'PUT' });
        const el = document.getElementById('notif-' + id);
        if (el) {
            el.classList.remove('unread-notification');
            el.querySelector('button[onclick*="markRead"]')?.remove();
        }
        const badge = document.getElementById('notification-badge');
        if (badge) {
            const c = Math.max(0, (parseInt(badge.textContent) || 0) - 1);
            updateBadge(c);
        }
    }

    async function markAllRead() {
        await apiCall('/api/notifications/read-all', { method: 'PUT' });
        window.location.reload();
    }

    async function deleteNotification(id) {
        await apiCall('/api/notifications/' + id, { method: 'DELETE' });
        document.getElementById('notif-' + id)?.remove();
    }
</script>
</body>
</html>
