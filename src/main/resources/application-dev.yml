spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mailnotifier_db
    username: mailnotifier
    password: mailnotifier
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mailnotifier:
  security:
    # Sadece dev ortamı için sabit anahtar — prod'da mutlaka TOKEN_ENCRYPTION_KEY env değişkeni set edilmeli
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:h7mrcFpa2+hBP7VOSPz9kExI9O4aA0ng9QBVmGkWcXU=}
  scan:
    interval: 5000  # dev ortamında 5 sn
  matching:
    strategy: nlp  # nlp yapmak için AI_API_KEY set et ve "nlp" yap

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.beril.mailnotifier: DEBUG
    AUDIT: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
