version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailnotifier-postgres
    environment:
      POSTGRES_DB: mailnotifier_db
      POSTGRES_USER: mailnotifier
      POSTGRES_PASSWORD: mailnotifier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailnotifier -d mailnotifier_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: mailnotifier_postgres_data
